<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Visualizer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
      p.sub { color: #888; font-size: 14px; margin-bottom: 48px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        max-width: 720px;
        width: 100%;
      }
      .card {
        background: #252540;
        border-radius: 12px;
        padding: 28px 24px;
        text-decoration: none;
        color: #e0e0e0;
        transition: background 0.2s, transform 0.2s;
      }
      .card:hover { background: #2e2e50; transform: translateY(-2px); }
      .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
      .card span { font-size: 13px; color: #888; }
      .card.disabled {
        opacity: 0.35;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>Spatial Visualizer</h1>
    <p class="sub">Kyrgyzstan: Axay Uru Valley — 3D mapping data</p>
    <div class="grid">
      <a class="card" href="/pointcloud.html">
        <h2>Point Cloud</h2>
        <span>262k points · vertex colors</span>
      </a>
      <a class="card disabled" href="#">
        <h2>Mesh</h2>
        <span>Coming soon</span>
      </a>
      <a class="card disabled" href="#">
        <h2>Gaussian Splat</h2>
        <span>Coming soon</span>
      </a>
    </div>
  </body>
</html>
